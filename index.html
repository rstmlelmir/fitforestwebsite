<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08110d" />
    <meta name="description" content="FitForest — məşqini, qidalanmanı və proqresini daha planlı idarə et." />
    <meta property="og:title" content="FitForest — öz ritmini qur" />
    <meta property="og:description" content="Daha planlı məşq, daha düzgün qidalanma, daha ölçülə bilən proqres." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fitforestapp.com" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/png" href="/fitforestlogoblackbackground.png" />
    <title>FitForest — öz ritmini qur</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // The PWA previously used the root domain. Remove its root-scope worker
      // and caches so the marketing site owns fitforestapp.com.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          registrations.forEach(function (registration) {
            registration.unregister();
          });
        });
      }
      if ('caches' in window) {
        caches.keys().then(function (keys) {
          keys.forEach(function (key) {
            caches.delete(key);
          });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
